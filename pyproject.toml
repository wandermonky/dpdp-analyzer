[project]
name = "dpdp-analyzer"
version = "0.1.0"
description = "DPDP Gap-Analyzer & Report Generator"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pydantic>=2",
    "pyyaml",
    "jinja2",
    "weasyprint",
    "typer",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "types-PyYAML", "pandas-stubs"]
ui = ["streamlit"]

[project.scripts]
dpdp-check = "dpdp_analyzer.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dpdp_analyzer*"]

[[tool.mypy.overrides]]
module = "weasyprint"
ignore_missing_imports = true
